<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tonton Jiee — Messagerie admin</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#8a3b52">
<link rel="manifest" href="admin-manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- Espace séparé de la PWA joueur : volontairement pas dans sw.js (pas
     besoin de fonctionner hors-ligne), pas de lien depuis l'app joueur.
     Accès protégé par Firebase Authentication (email/mot de passe) — voir
     README section "Messagerie" pour la procédure de création du compte
     admin et le réglage des règles Firestore. -->

<div id="login-screen" class="screen">
	<div class="login-card">
		<h1>💬 Tonton Jiee</h1>
		<p class="subtitle">Espace de messagerie — accès réservé</p>
		<input id="login-email" type="email" placeholder="Email" autocomplete="username" />
		<input id="login-password" type="password" placeholder="Mot de passe" autocomplete="current-password" />
		<button id="btn-login">Se connecter</button>
		<p id="login-error" class="error hidden"></p>
	</div>
</div>

<div id="admin-screen" class="screen hidden">
	<div class="admin-layout">
		<aside id="conversation-list-panel" class="conversation-list-panel">
			<div class="panel-header">
				<h2>Conversations</h2>
				<button id="btn-logout" title="Se déconnecter">⏻</button>
			</div>
			<div id="conversation-list"></div>
		</aside>

		<main id="conversation-view" class="conversation-view">
			<div id="conversation-empty" class="conversation-empty">
				Sélectionne une conversation à gauche.
			</div>
			<div id="conversation-open" class="conversation-open hidden">
				<div class="conversation-open-header">
					<button id="btn-back-to-list" class="mobile-only">‹</button>
					<span id="conversation-open-name"></span>
					<button id="btn-admin-notif" class="admin-icon-btn hidden" title="Activer les notifications" style="margin-left:auto;">🔔</button>
				</div>
				<div id="admin-messages" class="admin-messages"></div>
				<div id="admin-recording-indicator" class="admin-recording-indicator hidden"></div>
				<div id="admin-attach-menu" class="admin-attach-menu hidden">
					<button id="btn-admin-camera">📷 Prendre une photo</button>
					<button id="btn-admin-gallery">🖼️ Choisir depuis la galerie</button>
				</div>
				<div class="admin-input-bar">
					<button id="btn-admin-attach" class="admin-icon-btn" title="Joindre">➕</button>
					<button id="btn-admin-mic" class="admin-icon-btn" title="Message audio">🎤</button>
					<input id="admin-input" type="text" placeholder="Répondre…" autocomplete="off" />
					<button id="btn-admin-send" class="admin-send-btn" disabled>Envoyer</button>
					<input type="file" id="admin-camera-input" accept="image/*" capture="environment" class="hidden" />
					<input type="file" id="admin-gallery-input" accept="image/*" class="hidden" />
				</div>
			</div>
		</main>
	</div>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
